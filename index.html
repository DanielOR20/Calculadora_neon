<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Calculator</title>
  <meta name="description" content="Calculadora interactiva con estetica cyberpunk, construida con HTML, CSS y JavaScript vanilla.">
<link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="calculator">
    <header class="calc-title">Calculadora</header>
    <section class="display">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </section>

  <section class="buttons">
    <button class="btn btn-clear" data-action="clear">C</button>
    <button class="btn btn-op" data-action="delete">⌫</button>
    <button class="btn btn-op" data-value="%">%</button>
    <button class="btn btn-op" data-value="/">÷</button>

    <button class="btn" data-value="7">7</button>
    <button class="btn" data-value="8">8</button>
    <button class="btn" data-value="9">9</button>
    <button class="btn btn-op" data-value="*">×</button>

    <button class="btn" data-value="4">4</button>
    <button class="btn" data-value="5">5</button>
    <button class="btn" data-value="6">6</button>
    <button class="btn btn-op" data-value="-">−</button>

    <button class="btn" data-value="1">1</button>
    <button class="btn" data-value="2">2</button>
    <button class="btn" data-value="3">3</button>
    <button class="btn btn-op" data-value="+">+</button>

    <button class="btn btn-zero" data-value="0">0</button>
    <button class="btn" data-value=".">.</button>
    <button class="btn btn-equals" data-action="equals">=</button>
  </section>
  
</main>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
